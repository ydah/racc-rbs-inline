name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Racc ${{ matrix.racc }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4', '4.0']
        racc: ['1.8.1']
        include:
          - ruby: '3.2'
            racc: '1.6.2'
          - ruby: '3.2'
            racc: '1.7.3'
    env:
      RACC_VERSION: ${{ matrix.racc }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install development signatures
        run: bundle exec rbs collection install
      - name: Fetch pinned regression corpus
        run: ruby script/fetch-racc
      - name: Test and type check
        run: bundle exec rake
      - name: Check generated signatures are current
        run: git diff --exit-code -- sig/generated
      - name: Build gem
        run: bundle exec gem build racc-rbs-inline.gemspec
